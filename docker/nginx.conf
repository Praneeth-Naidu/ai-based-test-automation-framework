server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path nginx can't find as a real file falls back to
    # index.html, letting React Router take over client-side. Without this,
    # any direct navigation to a client-side route (e.g. page.goto('/editor'))
    # 404s, because nginx looks for a literal file/folder on disk first.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
